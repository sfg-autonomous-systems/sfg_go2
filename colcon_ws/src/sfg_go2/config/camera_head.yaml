ffmpeg_transport_settings: &ffmpeg_transport_settings
  encoding: h264_nvmpi

compressed_depth_transport_settings: &compressed_depth_transport_settings
  format: "rvl"

/**:
  ros__parameters:
    base_frame_id: camera_head
    tf_publish_rate: 0.0
    publish_tf: true
    diagnostics_period: 1.0

    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    enable_sync: true
    align_depth.enable: true

    rgb_camera.color_profile: 1280x720x15
    depth_module.depth_profile: 1280x720x15

    .camera_head:
      aligned_depth_to_color.image_raw.compressedDepth: *compressed_depth_transport_settings
      color.image_raw.ffmpeg: *ffmpeg_transport_settings

    camera_head:
      aligned_depth_to_color.image_raw.enable_pub_plugins:
        - image_transport/compressedDepth
      color.image_raw.enable_pub_plugins:
        - image_transport/ffmpeg
      depth.image_rect_raw.enable_pub_plugins:
        - image_transport/raw

    serial_no: "728312070152"
